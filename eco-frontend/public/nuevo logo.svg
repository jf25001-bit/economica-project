<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 160" width="500" height="160">
  <defs>
    <!-- Fondo con bordes redondeados y degradado Azul Petróleo -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2B3A4A" />
      <stop offset="100%" stop-color="#1F2B37" />
    </linearGradient>
    
    <!-- Degradado para el ícono -->
    <linearGradient id="iconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
  </defs>

  <!-- Contenedor / Tarjeta de fondo -->
  <rect width="500" height="160" rx="24" fill="url(#bgGrad)" />

  <!-- Isotipo: Contenedor del Carrito/Flechas -->
  <g transform="translate(30, 30)">
    <!-- Base del ícono -->
    <rect width="100" height="100" rx="20" fill="#3D4F63" opacity="0.4" />
    <rect width="100" height="100" rx="20" fill="none" stroke="#38BDF8" stroke-width="2" stroke-opacity="0.3" />

    <!-- Flechas dinámicas de ahorro -->
    <path d="M 20 65 L 45 40 L 60 55 L 85 30" fill="none" stroke="url(#iconGrad)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 85 30 L 65 30 M 85 30 L 85 50" fill="none" stroke="url(#iconGrad)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Carrito de Compras -->
    <path d="M 25 35 L 35 35 L 45 65 L 75 65 L 82 42 L 38 42" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="48" cy="76" r="6" fill="#FFFFFF" />
    <circle cx="72" cy="76" r="6" fill="#FFFFFF" />
  </g>

  <!-- Texto: Nombre de la Marca -->
  <text x="155" y="82" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="900" font-size="34" fill="#FFFFFF" letter-spacing="1">
    LA ECONÓMICA
  </text>

  <!-- Texto: Subtítulo / Ubicación -->
  <text x="157" y="112" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="700" font-size="16" fill="#38BDF8" letter-spacing="6">
    CHALATENANGO
  </text>
</svg>
